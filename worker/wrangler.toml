# Standalone Cloudflare Worker — consumes the "use-summary-jobs" queue and
# runs the AI extraction pipeline server-side. This is a SEPARATE deployable
# from the main Pages project (app/ + functions/api/*), which is untouched.
# See the background-job plan for the full picture; the producer side lives
# in the root wrangler.toml + functions/api/jobs.js.
#
# Setup this project needs in the Cloudflare dashboard before it can run
# (none of this can be done from the repo):
#   1. Deploy this project (Workers Builds git integration with root
#      directory "worker/", or manual `wrangler deploy` from this folder).
#   2. Set AZURE_CLIENT_SECRET as an encrypted secret on THIS Worker project
#      (separate secret store from the Pages project's copy):
#      `wrangler secret put AZURE_CLIENT_SECRET` from this folder.
#   3. Bind the same KV namespaces used by the Pages project (fill in the
#      ids below) — JOBS and AUDIT_LOG must be the SAME namespace ids as
#      root wrangler.toml's, so job records and the rate-limit/budget/audit
#      counters in AUDIT_LOG are shared across both the interactive and
#      background paths.
#   4. Confirm the queue consumer binding below took effect after first
#      deploy (Workers & Pages -> this project -> Settings -> Triggers).

name = "use-summary-jobs-worker"
main = "src/index.js"
compatibility_date = "2026-09-02"

[[kv_namespaces]]
binding = "JOBS"
id = "b5b4ba306a6b4539878eca9c4193556b"

[[kv_namespaces]]
binding = "AUDIT_LOG"
id = "039b547f3edb4752adda83a97470c9ff"

[[queues.consumers]]
queue = "use-summary-jobs"
max_batch_size = 1
# One file at a time — master labels make many Gateway calls; concurrency 2
# was exhausting the Gateway and leaving Bedrock/stream failures.
max_concurrency = 1
# A big label runs in ~10-minute slices (src/index.js re-queues itself with its
# progress saved in KV). These retries only cover a slice killed before it could
# re-queue; it resumes from the last saved chunk, not page 1.
max_retries = 8

# Lets a slice put its own file back on the queue to continue in a fresh invocation.
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "use-summary-jobs"

# Non-secret config for src/governance.js. Safe defaults are baked into the
# code too, so nothing breaks if these are ever unset. Keep these in sync
# with the root wrangler.toml's [vars] — both paths should use the same
# limits since they share the AUDIT_LOG counters.
[vars]
RATE_LIMIT_PER_MINUTE = "20"
# Raised for the 30/50-label scale test (Opus remediation can push ~$3/label).
DAILY_BUDGET_USD = "300"
AUDIT_TTL_SECONDS = "15552000"
AZURE_TENANT_ID = "fcb2b37b-5da0-466b-9b83-0014b67a7c78"
AZURE_CLIENT_ID = "5d0b410a-0b42-4427-8bd5-289c1ac0abce"
AZURE_SCOPE = "https://bayer.com/ai-gateway-prod-idp/.default"
# Pin EU plane — global anycast from US Cloudflare colos hits us.* which
# lacks Bedrock creds (403 CredentialResolutionError). eu.* returns 200.
TFY_BASE_URL = "https://eu.ai-gateway.int.bayer.ai/api/llm"
