server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Agentrix / platform liveness probe
  location = /health {
    default_type text/plain;
    return 200 'ok\n';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Avoid caching the single-page app shell during pilot deploys
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
