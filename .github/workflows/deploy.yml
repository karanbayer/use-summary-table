name: Deploy to Agentrix

# Prerequisites
# 1. Add a GitHub Actions secret named AGENTRIX_PAT.
# 2. The PAT must include scope deploy:agent and be limited to this project
#    (PROJECT_ID below). Create/rotate it in Agentrix → Token management.
# 3. Confirm PROJECT_ID / AGENT_ID / AGENT_NAME match this agent before first run.
#
# Push to the branch below (or use workflow_dispatch: Actions → Deploy to Agentrix → Run workflow) to redeploy.
# Deploy from here, not from the Agentrix UI, so every deploy gets the next version. After a run, `git pull`
# before your next push (the run adds a "Release x.y.z [skip ci]" commit).
# Runtime branch_name is taken from github.ref_name.
#
# A redeploy restarts the pod, and extraction jobs live in memory (DEPLOYMENT.md): a job running at that moment is
# lost. Push when no one is extracting, or use workflow_dispatch at a quiet time.

on:
  push:
    branches: [main]
    # Docs and tests do not change the app: no deploy for them.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "specs/**"
      - "tests/**"
  workflow_dispatch:

# One deploy at a time: each run starts from the version the previous run committed.
concurrency:
  group: deploy-agentrix
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository_owner == 'bayer-int'  # copies elsewhere do not deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commits the raised version back to the branch
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # the branch head, so a queued run sees the previous run's version commit

      # Every deploy needs a version Agentrix has not seen, or it builds from its cache (Eswar, 29 Oct).
      # One version for Agentrix, the Dockerfile and the agent files (Eswar, 24 Nov): raised here, committed, deployed.
      - name: Raise the version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(python3 scripts/bump_version.py)
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release ${VERSION} [skip ci]"
          for attempt in 1 2 3; do
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            if [[ $attempt == 3 ]]; then echo "::error::could not push the version commit"; exit 1; fi
            git fetch -q --depth=50 origin "${GITHUB_REF_NAME}"
            git rebase -q FETCH_HEAD
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Redeploy agent
        env:
          AGENTRIX_PAT: ${{ secrets.AGENTRIX_PAT }}
          API_BASE: "https://api.agentrix.int.bayer.ai"
          PROJECT_ID: "prj-ff9f7094"
          AGENT_ID: "agent-27163dcf"
          AGENT_NAME: "use-summary-table-extractor"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          echo "Using version=${VERSION}"

          curl -sS -f -X POST "${API_BASE}/api/agents/deploy" \
            -H "Content-Type: application/json" \
            -H "Agentrix-Pat: ${AGENTRIX_PAT}" \
            -d "$(jq -n \
              --arg project_id "$PROJECT_ID" \
              --arg existing_agent_id "$AGENT_ID" \
              --arg name "$AGENT_NAME" \
              --arg repo_url "${{ github.server_url }}/${{ github.repository }}.git" \
              --arg branch_name "${{ github.ref_name }}" \
              --arg version "$VERSION" \
              '{
                project_id: $project_id,
                existing_agent_id: $existing_agent_id,
                name: $name,
                repo_url: $repo_url,
                branch_name: $branch_name,
                version: $version
              }')"